// Enforce a consistent JVM 17 target for Java and Kotlin tasks in every
// Android project, including third-party Flutter plugins.
allprojects {
    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }

    tasks.configureEach { task ->
        if (task.class.name.contains('KotlinCompile')) {
            def kotlinOptions = task.hasProperty('kotlinOptions') ? task.property('kotlinOptions') : null
            if (kotlinOptions != null) {
                kotlinOptions.jvmTarget = '17'
            }
        }
    }
}
