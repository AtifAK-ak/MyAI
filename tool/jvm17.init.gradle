// Align Android compile SDK and Java/Kotlin targets across app and plugins.
allprojects {
    afterEvaluate {
        def androidExtension = extensions.findByName("android")
        if (androidExtension != null) {
            // AndroidX dependencies used by current Flutter plugins require API 34+.
            // Use API 36 consistently for every Android library and the app.
            androidExtension.compileSdk = 36
            androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
    }

    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Avoid hard class references that can fail during plugin configuration.
    tasks.matching { task -> task.name ==~ /compile.*Kotlin/ }.configureEach { task ->
        task.kotlinOptions.jvmTarget = "17"
    }
}
